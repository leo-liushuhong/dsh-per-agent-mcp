- insert:
    - id: per-agent-mcp
      name: '@local/dsh-per-agent-mcp'
      config:
        mode: auto
        servers:
          - serverName: playwright
            perAgent: true
            transport: stdio
            command: C:/Users/EDY/.dsh/dsh-runtimes/dsh-primary-runtime/dependencies/node/bin/node.exe
            args:
              - C:/Users/EDY/.dsh/pnpm-global/global/v11/f1ba5deecf382820a1996bc8b8b0d847c8cd0cbdb58241d0e90b74db7db23daf/node_modules/@playwright/mcp/cli.js
              - '--browser'
              - 'chrome'
              - '--idle-timeout'
              - '600000'
            startupTimeoutMs: 15000
            failOnStartupError: false
